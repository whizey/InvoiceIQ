[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy declarative relationships reference their target class as a
# string so the mapper can resolve it later; ruff reads those as undefined
# names. The alternative is a TYPE_CHECKING import block purely to satisfy
# the linter, which adds noise without adding safety.
"app/models/*.py" = ["F821"]
# conftest sets sys.path before importing app modules, so the imports
# genuinely cannot sit at the top of the file.
"tests/conftest.py" = ["E402"]
# Same reason: this module adjusts import state before importing pytest.
"tests/test_voice_flow.py" = ["E402"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's asyncio layer runs request code inside greenlets; without this the
# Python 3.12 tracer misses lines executed there and under-reports database-backed code.
concurrency = ["thread", "greenlet"]
omit = [
    "app/seed/*",              # narrative data generation, not application logic
    "app/ml/train.py",         # one-shot training script, exercised by running it, not asserted on
    "app/ml/synthetic_data.py", # ditto — inputs to train.py, not application logic
    "app/ml/common.py",        # shared eval core for the three real-data trainers below
    "app/ml/train_xgboost.py", # real-data trainers, run manually; their report.json files are the artifact
    "app/ml/train_random_forest.py",
    "app/ml/train_gradient_boosting.py",
    "app/ml/datasets/*",       # offline feature/split build, run manually before training
    "app/events/consumer.py",  # standalone sample script, not part of the app's request path
    "app/ml/compare_models.py",  # offline model comparison script
    "app/ml/create_customer_holdout_manifest.py",  # offline dataset analysis utility
    "app/ml/rolling_backtest.py",  # offline model backtesting utility
    "app/ml/verify_pretraining.py",  # offline pre-training verification utility
    # Offline training, benchmark, audit, and report generation added after
    # the runtime coverage gate was established. Runtime-imported survival
    # helpers and every serving module remain in the 80% denominator.
    "app/ml/audit_b2b_v2_calibration.py",
    "app/ml/audit_b2b_v2_platt.py",
    "app/ml/audit_b2b_v2_targets.py",
    "app/ml/audit_bpi_vendor_history.py",
    "app/ml/audit_lightgbm_calibration.py",
    "app/ml/backtest_bpi_recovery_policy.py",
    "app/ml/benchmark_bpi_survival_models.py",
    "app/ml/benchmark_bpi_xgboost_aft.py",
    "app/ml/benchmark_payment_models.py",
    "app/ml/build_bpi_model_comparison.py",
    "app/ml/build_model_comparison_contract.py",
    "app/ml/calibrate_b2b_v2.py",
    "app/ml/challenge_b2b_v2_lightgbm.py",
    "app/ml/evaluate_collections.py",
    "app/ml/finalize_b2b_v2_calibration.py",
    "app/ml/promote_b2b_v2_champions.py",
    "app/ml/stage3_validation.py",
    "app/ml/train_b2b_v2.py",
    "app/ml/train_late_days.py",
]

[tool.coverage.report]
skip_empty = true
