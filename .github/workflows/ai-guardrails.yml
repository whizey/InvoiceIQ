name: AI guardrails and model contracts

on:
  push:
    branches: [main, invoiceiq-integration]
    paths:
      - 'backend/app/agents/**'
      - 'backend/app/core/mutation_auth.py'
      - 'backend/app/main.py'
      - 'backend/app/api/**'
      - 'backend/app/services/action_policy.py'
      - 'backend/tests/test_ai_guardrails.py'
      - 'backend/tests/test_mutation_auth.py'
      - 'backend/tests/test_model_artifact_verification.py'
      - 'backend/tests/test_request_limits.py'
      - 'backend/tests/test_llm_telemetry.py'
      - 'backend/tests/fixtures/agent_safety_v1.json'
      - 'backend/tests/fixtures/assistant_eval_v1.json'
      - 'backend/tests/test_finance_agent.py'
      - 'backend/app/ml/artifacts/**/*.json'
      - 'scripts/verification/**'
      - '.github/workflows/ai-guardrails.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-safety:
    name: Agent security and model contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENV: test
      SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test AI guardrails and mutation authorization
        working-directory: backend
        run: python -m pytest -q tests/test_ai_guardrails.py tests/test_mutation_auth.py tests/test_model_artifact_verification.py tests/test_request_limits.py tests/test_llm_telemetry.py tests/test_finance_agent.py
      - name: Evaluate versioned offline agent safety cases
        working-directory: backend
        run: python -m app.agents.evaluation "$RUNNER_TEMP/invoiceiq-agent-evaluation.json"
      - name: Evaluate the receivables assistant offline (tool figures, fallback routing, grounding, policy)
        working-directory: backend
        run: python -m app.agents.assistant_eval "$RUNNER_TEMP/invoiceiq-assistant-eval.json"
      - name: Validate model contracts without downloading LFS objects
        run: python scripts/verification/check_model_artifacts.py

  assistant-live-eval:
    name: Receivables assistant against live free-tier models
    # Manual only: it spends free-tier quota and depends on provider availability.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENV: test
      SCHEDULER_ENABLED: 'false'
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Run the 20-question eval and fail below 80% answer accuracy
        working-directory: backend
        run: python -m app.agents.assistant_eval "$RUNNER_TEMP/assistant-live-eval.json" --live --min-accuracy 0.8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-live-eval
          path: ${{ runner.temp }}/assistant-live-eval.json
