name: Repository security

on:
  push:
    branches: [main, invoiceiq-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Repository secret history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Block private local files
        run: python3 scripts/verification/check_repo_privacy.py
      # The CLI scans every commit reachable from any ref. The packaged action derives its range from the pull
      # request base, which fails when histories are unrelated.
      - name: Scan the full history for secrets
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --log-opts="--all" --redact --no-banner --exit-code 2

  dependencies:
    name: Python and npm vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Python dependency set
        run: |
          python -m pip install pip-audit
          cd backend
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-dev.txt
          test "$(grep -c '^xgboost==3.4.1$' requirements.txt)" = 1
          sed 's/^xgboost==3.4.1$/xgboost-cpu==3.4.1/' requirements.txt > "$RUNNER_TEMP/invoiceiq-container-requirements.txt"
          python -m pip_audit -r "$RUNNER_TEMP/invoiceiq-container-requirements.txt"
      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
