name: Repository security

on:
  push:
    branches: [main, invoiceiq-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Repository secret history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Block private and coding-assistant state files
        run: python3 scripts/verification/check_repo_privacy.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Python and npm vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Python dependency set
        run: |
          python -m pip install pip-audit
          cd backend
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-dev.txt
      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
