services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recovery_user
      POSTGRES_PASSWORD: recovery_pass
      POSTGRES_DB: recovery_db
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_user -d recovery_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MTIzNDU2Nzg5MGFiY2RlZg"
    ports:
      # Host access (e.g. running app/events/consumer.py locally, outside Docker).
      - "9094:9094"

  redis:
    image: redis:7-alpine
    ports:
      # Host access; mapped off the default 6379 in case Redis is already
      # running natively (same reasoning as Postgres's 5433 mapping).
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://recovery_user:recovery_pass@db:5432/recovery_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Neither Kafka nor Redis gate startup with service_healthy — both are
      # best-effort side channels (see app/events/, app/core/locks.py); the
      # API must not fail to start just because they aren't ready yet.
      kafka:
        condition: service_started
      redis:
        condition: service_started

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      # Server-only — resolved inside the `web` container, never sent to
      # the browser, so it talks to `api` over the compose network.
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
